[build]
  command = "pnpm -r --if-present run build"
  publish = "artifacts/salon/dist/public"
  functions = "artifacts/api-server/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"
  BASE_PATH = "/"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
