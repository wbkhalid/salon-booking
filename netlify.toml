[build]
  command = "pnpm --filter @workspace/api-server --filter @workspace/salon run build"
  publish = "artifacts/salon/dist/public"
  functions = "artifacts/api-server/dist"

[functions]
  node_bundler = "esbuild"
  format = "esm"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"
  BASE_PATH = "/"
  PORT = "5173"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
